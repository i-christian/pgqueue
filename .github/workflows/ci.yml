name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: task_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Install CGO build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential
      
    - name: Install dependencies
      run: go mod download

    - name: Run Integration Tests
      env:
        CGO_ENABLED: 1
        TEST_DB_DSN: "postgres://user:pass@localhost:5432/task_queue_test?sslmode=disable"
      run: go test -v -race ./...
